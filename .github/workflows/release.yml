name: Release Creation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from module.json
        id: get_version
        run: |
          VERSION=$(jq -r .version module.json)
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT

      - name: Package module
        run: |
          zip -r module.zip module.json scripts styles lang README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.get_version.outputs.VERSION }}
          name: Release ${{ github.ref_type == 'tag' && github.ref_name || steps.get_version.outputs.VERSION }}
          files: |
            module.json
            module.zip
          draft: false
          prerelease: false
          generate_release_notes: true
